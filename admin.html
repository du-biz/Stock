<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="admin-panel">

    <div class="admin-header">
      <h1>Adicionar Produto</h1>
      <button id="themeToggle">🌙</button>
    </div>

    <input type="text" id="name" placeholder="Nome">
    <input type="text" id="sku" placeholder="SKU">
    <input type="text" id="sizes" placeholder="42 (2),43 (1)">
    <input type="number" id="oldPrice" placeholder="Preço antigo">
    <input type="number" id="price" placeholder="Preço">
    
    <input type="text" id="image" placeholder="URL da imagem (Opcional)">
    <p class="upload-divider">OU FAZ UPLOAD:</p>
    <input type="file" id="imageFile" accept="image/*">

    <select id="category">
      <option value="sneakers">Sneakers</option>
      <option value="clothing">Clothing</option>
    </select>

    <label class="checkbox-label">
      <input type="checkbox" id="isHidden" class="checkbox-input">
      Ocultar produto do site público
    </label>

    <button id="addProduct">
      Adicionar Produto
    </button>
    
    <button id="cancelEdit" class="btn-cancel">
      Cancelar Edição
    </button>

    <button id="logoutBtn">
      Logout
    </button>

    <hr class="admin-divider">
    
    <h2 class="inventory-title">Gerir Inventário</h2>
    
    <div id="adminProductList" class="admin-list"></div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="supabase.js"></script>
  <script src="admin.js"></script>

</body>
</html>
